<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sanctuary | Neural Balance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #010413; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .active-mode { border-color: currentColor !important; background: rgba(255, 255, 255, 0.1) !important; opacity: 1 !important; }
        .transition-custom { transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        input::placeholder { color: rgba(255,255,255,0.2); }
        @keyframes pulse-energy { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
        .energy-hint { animation: pulse-energy 4s infinite; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-50 p-8 flex justify-between items-center">
        <div class="text-sm font-light tracking-[0.5em] opacity-50">ZEN_SANCTUARY</div>
        <button onclick="toggleLang()" id="lang-btn" class="glass px-6 py-2 rounded-full text-[10px] uppercase tracking-widest border border-white/10 hover:bg-white/5 transition-custom">ENGLISH 🌐</button>
    </nav>

    <section id="hero" class="min-h-screen flex flex-col justify-center items-center px-4 text-center z-10 relative">
        <h1 id="main-title" class="text-7xl md:text-9xl font-thin mb-12 tracking-tighter transition-custom">
            Tu mente, <span class="block opacity-40">en orden.</span>
        </h1>
        
        <div class="w-full max-w-xl space-y-12">
            <input type="text" id="mainTask" placeholder="¿En qué vas a trabajar?" 
                   class="w-full bg-transparent border-b border-white/10 p-6 outline-none transition-custom text-center text-2xl md:text-3xl font-extralight focus:border-white/40">
            
            <div class="flex flex-wrap justify-center gap-6">
                <button id="mode-focus" onclick="setMode('focus')" class="px-8 py-2 rounded-full text-[10px] uppercase tracking-widest opacity-20 border border-blue-500 text-blue-400 transition-custom">Enfoque</button>
                <button id="mode-calm" onclick="setMode('calm')" class="px-8 py-2 rounded-full text-[10px] uppercase tracking-widest opacity-20 border border-purple-500 text-purple-400 transition-custom">Calma</button>
                <button id="mode-creative" onclick="setMode('creative')" class="px-8 py-2 rounded-full text-[10px] uppercase tracking-widest opacity-20 border border-yellow-500 text-yellow-400 transition-custom">Crear</button>
            </div>

            <button onclick="startApp()" id="start-btn" class="group relative px-12 py-4 overflow-hidden rounded-full bg-white text-black text-[10px] font-bold uppercase tracking-[0.3em] transition-custom hover:scale-105">
                <span class="relative z-10">Entrar</span>
            </button>
        </div>
    </section>

    <main id="app-container" class="hidden fixed inset-0 z-[100] bg-[#00020a] flex flex-col md:flex-row">
        <aside class="w-full md:w-96 glass p-12 flex flex-col justify-between z-20">
            <div class="space-y-12">
                <button onclick="location.reload()" id="back-btn" class="opacity-30 text-[10px] uppercase tracking-[0.3em] hover:opacity-100 transition-custom">← Volver</button>
                
                <div>
                    <h2 id="app-label" class="text-[10px] uppercase tracking-[0.4em] font-bold mb-4"></h2>
                    <div id="displayTask" class="text-3xl font-extralight italic text-slate-200 leading-tight"></div>
                </div>
                
                <div class="space-y-6">
                    <p id="hint-text" class="text-[9px] uppercase tracking-widest text-white/20 energy-hint leading-relaxed">
                        Mueve el cursor para estabilizar la energía de tu enfoque
                    </p>
                    
                    <button onclick="toggleNoise()" class="w-full glass p-6 rounded-3xl border border-white/5 hover:bg-white/5 transition-custom text-left flex justify-between items-center group">
                        <span id="noise-label" class="text-[10px] uppercase tracking-[0.2em] opacity-40 group-hover:opacity-100">Sonido Brown</span>
                        <div id="noise-dot" class="w-1.5 h-1.5 rounded-full bg-blue-500 opacity-0 transition-custom"></div>
                    </button>
                </div>
            </div>
            
            <div class="text-[9px] opacity-10 uppercase tracking-[0.3em]">
                NEURAL_REGULATION // 2026
            </div>
        </aside>
        
        <div id="canvas-container" class="flex-1 bg-black"></div>
    </main>

        let audioCtx, noiseNode, isPlaying = false;
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

                enter: 'Entrar', back: '← Volver', 
                hint: 'Mueve el cursor para estabilizar la energía de tu enfoque',
                noise: 'Sonido Brown',
                modes: { focus: 'MODO ENFOQUE', calm: 'MODO CALMA', creative: 'MODO CREATIVO' }
            },
            en: {
                title: 'Your mind, <span class="block opacity-40">uncluttered.</span>',
                placeholder: 'What is your focus?',
                focus: 'Focus', calm: 'Calm', creative: 'Create',
                enter: 'Enter', back: '← Back', 
                hint: 'Move cursor to stabilize your focus energy',
                noise: 'Brown Noise',
                modes: { focus: 'FOCUS MODE', calm: 'CALM MODE', creative: 'CREATIVE MODE' }
            }
        };

        const moods = {
            focus: { color: 0x3b82f6, speed: 0.001, keywords: ['leer','estudiar','trabajo','code','write','study','work'] },
            calm: { color: 0xa855f7, speed: 0.0005, keywords: ['examen','estres','ansiedad','stress','anxiety','test'] },
            creative: { color: 0xfacc15, speed: 0.002, keywords: ['crear','diseñar','musica','create','design','art'] }
        };

        // Manejo de Idioma
        function toggleLang() {
            isEnglish = !isEnglish;
            const l = isEnglish ? lang.en : lang.es;
            document.getElementById('lang-btn').innerText = isEnglish ? "ESPAÑOL 🌐" : "ENGLISH 🌐";
            document.getElementById('main-title').innerHTML = l.title;
            document.getElementById('mainTask').placeholder = l.placeholder;
            document.getElementById('mode-focus').innerText = l.focus;
            document.getElementById('mode-calm').innerText = l.calm;
            document.getElementById('mode-creative').innerText = l.creative;
            document.getElementById('start-btn').innerText = l.enter;
            document.getElementById('back-btn').innerText = l.back;
            document.getElementById('hint-text').innerText = l.hint;
            document.getElementById('noise-label').innerText = l.noise
