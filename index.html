<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sanctuary | Neural Balance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #020617; color: white; overflow: hidden; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .active-mode { border-color: currentColor !important; background: rgba(255, 255, 255, 0.1) !important; opacity: 1 !important; }
        .transition-all { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pulse-soft { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.6; } }
        .animate-pulse-soft { animation: pulse-soft 4s infinite; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-50 p-6 flex justify-between items-center">
        <div class="text-xl font-light tracking-widest opacity-80">ZEN_SANCTUARY</div>
        <button onclick="toggleLang()" id="lang-btn" class="glass px-5 py-2 rounded-full text-[10px] uppercase tracking-widest border border-white/20 hover:bg-white/10 transition-all">English 🌐</button>
    </nav>

    <section id="hero" class="min-h-screen flex flex-col justify-center items-center px-4 text-center transition-all duration-700">
        <h1 class="text-6xl md:text-8xl font-thin mb-8 tracking-tighter">
            <span id="h-1">Tu mente,</span> <br class="md:hidden"> <span class="gradient-text" id="h-2">en orden.</span>
        </h1>
        
        <div class="w-full max-w-xl space-y-10">
            <div class="relative">
                <input type="text" id="mainTask" placeholder="¿En qué vas a trabajar?" 
                       class="w-full bg-slate-800/20 border-2 border-slate-700 p-8 rounded-3xl outline-none transition-all text-center text-xl md:text-2xl font-light focus:border-white/30">
                <div id="mode-indicator" class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[9px] uppercase tracking-[0.3em] font-bold opacity-0 transition-all duration-500"></div>
            </div>
            
            <div class="flex flex-wrap justify-center gap-4">
                <button id="mode-focus" onclick="selectMode('focus')" class="px-8 py-3 rounded-2xl text-[10px] uppercase tracking-widest opacity-30 border border-blue-500 text-blue-400 transition-all">Enfoque</button>
                <button id="mode-calm" onclick="selectMode('calm')" class="px-8 py-3 rounded-2xl text-[10px] uppercase tracking-widest opacity-30 border border-purple-500 text-purple-400 transition-all">Calma</button>
                <button id="mode-creative" onclick="selectMode('creative')" class="px-8 py-3 rounded-2xl text-[10px] uppercase tracking-widest opacity-30 border border-yellow-500 text-yellow-400 transition-all">Crear</button>
            </div>

            <button onclick="startApp()" id="start-btn" class="w-full md:w-64 bg-white text-black font-bold p-6 rounded-3xl hover:scale-105 transition-all uppercase tracking-[0.2em] text-sm mx-auto block shadow-2xl">
                Entrar
            </button>
        </div>
    </section>

    <main id="app-container" class="hidden fixed inset-0 z-[100] bg-[#010208] flex flex-col md:flex-row">
        <aside class="w-full md:w-80 glass p-10 flex flex-col justify-between z-10 border-r border-white/5">
            <div>
                <button onclick="location.reload()" id="back-btn" class="mb-16 opacity-40 text-[10px] uppercase tracking-[0.3em] hover:opacity-100 transition-all">← Volver</button>
                <div class="space-y-2 mb-10">
                    <h2 id="app-label" class="text-[10px] uppercase tracking-[0.4em] font-bold"></h2>
                    <div id="displayTask" class="text-3xl font-extralight italic text-slate-100 leading-tight"></div>
                </div>
                
                <p id="interaction-hint" class="text-[9px] uppercase tracking-widest text-white/30 animate-pulse-soft mb-12 leading-relaxed">
                    Interactúa con la frecuencia para estabilizar tu flujo
                </p>

                <button onclick="toggleNoise()" id="noise-btn" class="w-full glass p-6 rounded-2xl border border-white/10 hover:bg-white/5 transition-all text-left">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] uppercase tracking-[0.2em] opacity-60">Brown Noise</span>
                        <span id="noise-status" class="text-[10px] font-bold text-blue-400 opacity-0">ACTIVE</span>
                    </div>
                </button>
            </div>
            <div class="text-[9px] opacity-20 uppercase tracking-[0.2em] leading-relaxed">
                ADHD Neutralization <br> Generative Core 3.0
            </div>
        </aside>
        <div id="canvas-container" class="flex-1 bg-black cursor-crosshair"></div>
    </main>

        let currentMode = 'focus';
        let audio
