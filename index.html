<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sanctuary | Intelligent Deep Focus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #020617; color: white; overflow-x: hidden; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .active-mode { border-color: currentColor !important; background: rgba(255, 255, 255, 0.15) !important; opacity: 1 !important; transform: scale(1.05); }
        .transition-all { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pulse-soft { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
        .animate-pulse-soft { animation: pulse-soft 3s infinite; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-50 p-6 flex justify-between items-center">
        <div class="text-xl font-light tracking-widest opacity-70">ZEN_SANCTUARY</div>
        <button onclick="toggleLang()" id="lang-btn" class="glass px-4 py-2 rounded-full text-[10px] uppercase tracking-widest border border-white/20 hover:bg-white/10 transition-all">English 🌐</button>
    </nav>

    <section id="hero" class="min-h-screen flex flex-col justify-center items-center px-4 text-center">
        <h1 class="text-6xl md:text-8xl font-thin mb-8 tracking-tighter">
            <span id="h-1">Tu mente,</span> <br class="md:hidden"> <span class="gradient-text" id="h-2">en orden.</span>
        </h1>
        
        <div class="w-full max-w-xl space-y-8">
            <div class="relative group">
                <input type="text" id="mainTask" placeholder="¿En qué vas a trabajar?" 
                       class="w-full bg-slate-800/20 border-2 border-slate-700 p-8 rounded-3xl outline-none transition-all text-center text-xl md:text-2xl font-light focus:border-white/40 focus:bg-slate-800/40">
                <div id="mode-hint" class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[9px] uppercase tracking-[0.2em] font-bold opacity-0 transition-all">
                    Analizando intención...
                </div>
            </div>
            
            <div class="flex flex-wrap justify-center gap-3">
                <button id="mode-focus" class="px-6 py-3 rounded-2xl text-[10px] uppercase tracking-widest opacity-30 border border-blue-500 text-blue-400 transition-all">Enfoque / Focus</button>
                <button id="mode-calm" class="px-6 py-3 rounded-2xl text-[10px] uppercase tracking-widest opacity-30 border border-purple-500 text-purple-400 transition-all">Calma / Calm</button>
                <button id="mode-creative" class="px-6 py-3 rounded-2xl text-[10px] uppercase tracking-widest opacity-30 border border-yellow-500 text-yellow-400 transition-all">Crear / Create</button>
            </div>

            <button onclick="startApp()" id="start-btn" class="w-full md:w-64 bg-white text-black font-bold p-6 rounded-3xl hover:scale-105 transition-all uppercase tracking-widest text-sm mx-auto block shadow-2xl">
                Entrar al Santuario
            </button>
        </div>
    </section>

    <main id="app-container" class="hidden fixed inset-0 z-[100] bg-black flex flex-col md:flex-row">
        <aside class="w-full md:w-80 glass p-10 flex flex-col justify-between z-10">
            <div>
                <button onclick="location.reload()" class="mb-12 opacity-40 text-[10px] uppercase tracking-[0.2em] hover:opacity-100 transition-all">← Salir / Exit</button>
                <h2 id="app-label" class="text-[10px] uppercase tracking-[0.4em] mb-3 font-bold"></h2>
                <div id="displayTask" class="text-2xl font-extralight italic text-slate-200 mb-8 leading-tight"></div>
                
                <p id="interaction-hint" class="text-[9px] uppercase tracking-widest text-white/30 animate-pulse-soft mb-12">
                    Mueve el ratón para equilibrar la energía
                </p>

                <div class="space-y-4">
                    <button onclick="toggleNoise()" id="noise-btn" class="w-full glass p-5 rounded-2xl border border-white/10 hover:bg-white/5 transition-all text-left flex justify-between items-center group">
                        <span class="text-[10px] uppercase tracking-[0.2em] opacity-60 group-hover:opacity-100">Brown Noise</span>
                        <span id="noise-status" class="text-[10px] font-bold text-blue-400 opacity-0 transition-all">ACTIVE</span>
                    </button>
                </div>
            </div>
            <div class="text-[9px] opacity-20 uppercase tracking-[0.2em] leading-relaxed">
                ADHD Digital Regulation.<br>Análisis semántico bilingüe.
            </div>
        </aside>
        <div id="canvas-container" class="flex-1 bg-slate-950 cursor-crosshair"></div>
    </main>

    <script>
        let currentMode = 'focus';
        let audioCtx, noiseNode, isPlaying = false;
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

        const moods = {
            focus: { 
                color: 0x60a5fa, speed: 0.0012, label: "ENFOQUE / FOCUS",
                words: ['leer', 'estudiar', 'trabajo', 'reporte', 'escribir', 'mail', 'ordenar', 'programar', 'codigo', 'excel', 'finanzas', 'analisis', 'datos', 'organizar', 'read', 'study', 'work', 'report', 'write', 'email', 'code', 'coding', 'finance', 'data', 'math', 'homework', 'task', 'spreadsheet', 'organize', 'plan', 'history', 'law', 'physics', 'science']
            },
            calm: { 
                color: 0xa855f7, speed: 0.0004, label: "CALMA / CALM",
                words: ['laboratorio', 'examen', 'final', 'estres', 'ansiedad', 'nervios', 'miedo', 'paz', 'urgente', 'parcial', 'medicina', 'dormir', 'descansar', 'entrega', 'mañana', 'deadline', 'stress', 'anxiety', 'nervous', 'scared', 'urgent', 'exam', 'test', 'medical', 'sleep', 'relax', 'peace', 'rest', 'panic', 'lab', 'hospital', 'court', 'pressure', 'worry']
            },
            creative: { 
                color: 0xfacc15, speed: 0.0025, label: "CREATIVIDAD / CREATE",
                words: ['crear', 'dibujar', 'diseñar', 'idea', 'musica', 'pintar', 'inventar', 'colores', 'boceto', 'improvisar', 'poesia', 'arte', 'branding', 'logo', 'fotos', 'video', 'create', 'draw', 'design', 'music', 'paint', 'invent', 'colors', 'sketch', 'poetry', 'art', 'photography', 'brand', 'lyrics', 'game', 'fashion', 'style', 'brainstorm']
            }
        };

        // Capturar mouse
        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth) - 0.5;
            targetY = (e.clientY / window.innerHeight) - 0.5;
        });

        // MOTOR SEMÁNTICO
        document.getElementById('mainTask').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            if(val.length < 3) return;

            let scores = { focus: 0, calm: 0, creative: 0 };
            for (let mode in moods) {
                moods[mode].words.forEach(w => {
                    if (val.includes(w)) scores[mode]++;
                });
            }

            let winner = 'focus';
            if (scores.calm > scores.focus && scores.calm >= scores.creative) winner = 'calm';
            else if (scores.creative > scores.focus && scores.creative > scores.calm) winner = 'creative';

            updateInterface(winner);
            
            const hint = document.getElementById('mode-hint');
            hint.style.opacity = "1";
            hint.style.color = winner === 'focus' ? '#60a5fa' : winner === 'calm' ? '#a855f7' : '#facc15';
            hint.innerText = moods[winner].label;
        });

        function updateInterface(mode) {
            currentMode = mode;
            document.querySelectorAll('[id^="mode-"]').forEach(b => b.classList.remove('active-mode'));
            document.getElementById(`mode-${mode}`).classList.add('active-mode');
            const colors = { focus: '#60a5fa', calm: '#a855f7', creative: '#facc15' };
            document.getElementById('mainTask').style.borderColor = colors[mode];
        }

        updateInterface('focus');

        function startApp() {
            const task = document.getElementById('mainTask').value;
            if(!task) return alert("Define tu objetivo / Define your focus.");
            document.getElementById('displayTask').innerText = `"${task}"`;
            document.getElementById('app-label').innerText = moods[currentMode].label;
            document.getElementById('app-label').style.color = `#${moods[currentMode].color.toString(16)}`;
            document.getElementById('app-container').classList.remove('hidden');
            initThree(moods[currentMode].color, moods[currentMode].speed);
        }

        function toggleNoise() {
            if(!isPlaying) {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                noiseNode = audioCtx.createScriptProcessor(4096, 1, 1);
                let lastOut = 0;
                noiseNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < 4096; i++) {
                        let white = Math.random() * 2 - 1;
                        out[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = out[i];
                        out[i] *= 3.5;
                    }
                };
                noiseNode.connect(audioCtx.destination);
                document.getElementById('noise-status').style.opacity = "1";
            } else {
                noiseNode.disconnect();
                document.getElementById('noise-status').style.opacity = "0";
            }
            isPlaying = !isPlaying;
        }

        function initThree(col, spd) {
            const container = document.getElementById('canvas-container');
            container.innerHTML = "";
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth/container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            
            const sphere = new THREE.Mesh(
                new THREE.IcosahedronGeometry(2, 20),
                new THREE.MeshStandardMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.4 })
            );
            scene.add(sphere);
            scene.add(new THREE.PointLight(0xffffff, 1.5, 100).clone().set(10,10,10));
            scene.add(new THREE.AmbientLight(0xffffff, 0.2));
            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                mouseX += (targetX - mouseX) * 0.05; // Lerp para inercia
                mouseY += (targetY - mouseY) * 0.05;
                sphere.rotation.y += 0.002 + (mouseX * 0.1);
                sphere.rotation.x += (mouseY * 0.1);
                let s = 1 + Math.sin(Date.now() * spd) * 0.15;
                sphere.scale.set(s,s,s);
                renderer.render(scene, camera);
            }
            animate();
        }

        function toggleLang() {
            const btn = document.getElementById('lang-btn');
            const isEs = btn.innerText.includes('English');
            btn.innerText = isEs ? "Español 🌐" : "English 🌐";
            document.getElementById('h-1').innerText = isEs ? "Your mind," : "Tu mente,";
            document.getElementById('h-2').innerText = isEs ? "uncluttered." : "en orden.";
            document.getElementById('mainTask').placeholder = isEs ? "What are you working on?" : "¿En qué vas a trabajar?";
            document.getElementById('start-btn').innerText = isEs ? "Enter" : "Entrar al Santuario";
        }
    </script>
</body>
</html>
