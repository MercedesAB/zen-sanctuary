<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sanctuary | Digital Refuge & Focus ADHD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #020617; color: white; overflow-x: hidden; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        /* Clase para resaltar el modo seleccionado */
        .active-mode { border-color: white !important; background: rgba(255, 255, 255, 0.15) !important; opacity: 1 !important; }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-50 p-6 flex justify-between items-center">
        <div class="text-xl font-light tracking-widest">ZEN_SANCTUARY</div>
        <div class="flex gap-4 items-center">
            <button onclick="toggleLang()" id="lang-btn" class="text-[10px] uppercase tracking-widest opacity-70 hover:opacity-100 transition-all border border-white/20 px-3 py-1 rounded-full">
                English 🌐
            </button>
            <a href="#" id="nav-premium" class="glass px-4 py-2 rounded-full text-sm font-medium hover:bg-white/10 transition-all">Obtener Premium</a>
        </div>
    </nav>

    <section id="hero" class="min-h-screen flex flex-col justify-center items-center px-4 text-center">
        <h1 class="text-6xl md:text-8xl font-thin mb-6 tracking-tighter">
            <span id="hero-title-base">Tu mente,</span> 
            <span class="gradient-text" id="hero-span">en orden.</span>
        </h1>
        <p id="hero-p" class="max-w-2xl text-slate-400 text-lg md:text-xl mb-10">
            Un santuario interactivo basado en ciencia para el enfoque, la regulación del TDAH y la claridad mental.
        </p>
        
        <div class="w-full max-w-md space-y-4">
            <input type="text" id="mainTask" placeholder="¿En qué te vas a enfocar?" 
                   class="w-full bg-slate-800/50 border border-slate-700 p-5 rounded-2xl outline-none focus:border-blue-500 transition-all text-center">
            
            <div class="flex gap-2">
                <button onclick="setMode('focus')" id="mode-focus" class="flex-1 glass p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-50 hover:opacity-100 active-mode border-blue-500/50">Enfoque</button>
                <button onclick="setMode('calm')" id="mode-calm" class="flex-1 glass p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-50 hover:opacity-100 border-purple-500/50">Calma</button>
                <button onclick="setMode('creative')" id="mode-creative" class="flex-1 glass p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-50 hover:opacity-100 border-yellow-500/50">Crear</button>
            </div>

            <button onclick="startApp()" id="hero-btn" class="w-full bg-white text-black font-bold p-5 rounded-2xl hover:bg-slate-200 transition-all uppercase tracking-widest text-sm">
                Entrar al Santuario
            </button>
        </div>
    </section>

    <main id="app-container" class="hidden fixed inset-0 z-[100] bg-black flex flex-col md:flex-row">
        <aside class="w-full md:w-80 glass p-8 flex flex-col justify-between z-10">
            <div>
                <button onclick="closeApp()" id="app-back" class="mb-10 opacity-50 hover:opacity-100 text-[10px] uppercase">← Volver</button>
                <h2 id="app-focus-label" class="text-[10px] uppercase tracking-widest text-blue-400 mb-8 font-semibold italic">Modo Activo</h2>
                <div id="displayTask" class="text-2xl font-light mb-12 italic text-slate-200"></div>
                
                <h2 id="app-sounds-label" class="text-[10px] uppercase tracking-widest text-blue-400 mb-4 font-semibold">Sonido Ambiente</h2>
                <div class="space-y-4">
                    <button id="btn-brown" onclick="toggleBrownNoise()" class="w-full text-left p-4 rounded-xl border border-transparent hover:bg-white/5 transition-all flex justify-between items-center group">
                        <span>Brown Noise</span>
                        <span id="status-brown" class="text-[10px] opacity-40 group-hover:opacity-100">PLAY</span>
                    </button>
                </div>
            </div>
            <div id="app-footer" class="text-[10px] opacity-30 leading-relaxed uppercase tracking-tighter mt-8">
                Frecuencias ajustadas al modo seleccionado.
            </div>
        </aside>
        <div id="canvas-container" class="flex-1 relative bg-slate-950"></div>
    </main>

    <script>
        let audioCtx, noiseNode, isPlaying = false;
        let currentLang = 'es';
        let currentMode = 'focus';

        // Correspondencia de lógica: Color, Velocidad de pulso y Etiquetas
        const configs = {
            focus: { color: 0x60a5fa, speed: 0.001, label_es: "ENFOQUE PROFUNDO", label_en: "DEEP FOCUS" },
            calm: { color: 0xa855f7, speed: 0.0005, label_es: "CALMA TERAPÉUTICA", label_en: "THERAPEUTIC CALM" },
            creative: { color: 0xfacc15, speed: 0.002, label_es: "ESTADO CREATIVO", label_en: "CREATIVE FLOW" }
        };

        const texts = {
            es: { langBtn: "English 🌐", navPremium: "Obtener Premium", heroTitleBase: "Tu mente,", heroSpan: "en orden.", heroP: "Un santuario interactivo basado en ciencia para el enfoque, la regulación del TDAH y la claridad mental.", heroInput: "¿En qué te vas a enfocar?", heroBtn: "Entrar al Santuario", appBack: "← Volver", appSounds: "Sonido Ambiente" },
            en: { langBtn: "Español 🌐", navPremium: "Get Premium", heroTitleBase: "Your mind,", heroSpan: "uncluttered.", heroP: "A science-based interactive sanctuary for focus, ADHD regulation, and mental clarity.", heroInput: "What's your focus?", heroBtn: "Enter Sanctuary", appBack: "← Back", appSounds: "Ambient Sound" }
        };

        function setMode(mode) {
            currentMode = mode;
            // Actualizar botones visualmente
            document.querySelectorAll('[id^="mode-"]').forEach(b => b.classList.remove('active-mode'));
            document.getElementById(`mode-${mode}`).classList.add('active-mode');
        }

        function toggleLang() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            const t = texts[currentLang];
            document.getElementById('lang-btn').innerText = t.langBtn;
            document.getElementById('nav-premium').innerText = t.navPremium;
            document.getElementById('hero-title-base').innerText = t.heroTitleBase;
            document.getElementById('hero-span').innerText = t.heroSpan;
            document.getElementById('hero-p').innerText = t.heroP;
            document.getElementById('mainTask').placeholder = t.heroInput;
            document.getElementById('hero-btn').innerText = t.heroBtn;
            document.getElementById('app-back').innerText = t.appBack;
            document.getElementById('app-sounds-label').innerText = t.appSounds;
        }

        function startApp() {
            const task = document.getElementById('mainTask').value;
            if(!task) return alert(currentLang === 'es' ? "Define tu tarea." : "Define your task.");
            
            const config = configs[currentMode];
            document.getElementById('displayTask').innerText = `"${task}"`;
            document.getElementById('app-focus-label').innerText = currentLang === 'es' ? config.label_es : config.label_en;
            document.getElementById('app-focus-label').style.color = `#${config.color.toString(16)}`;
            
            document.getElementById('app-container').classList.remove('hidden');
            initThree(config.color, config.speed);
        }

        function closeApp() {
            stopBrownNoise();
            document.getElementById('app-container').classList.add('hidden');
        }

        function toggleBrownNoise() {
            if (!isPlaying) startBrownNoise(); else stopBrownNoise();
        }

        function startBrownNoise() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = 4096;
            let lastOut = 0.0;
            noiseNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
            noiseNode.onaudioprocess = function(e) {
                let output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    output[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = output[i];
                    output[i] *= 3.5;
                }
            }
            noiseNode.connect(audioCtx.destination);
            isPlaying = true;
            document.getElementById('btn-brown').classList.add('active-sound');
            document.getElementById('status-brown').innerText = 'STOP';
        }

        function stopBrownNoise() {
            if (noiseNode) {
                noiseNode.disconnect();
                noiseNode = null;
                isPlaying = false;
                document.getElementById('btn-brown').classList.remove('active-sound');
                document.getElementById('status-brown').innerText = 'PLAY';
            }
        }

        function initThree(color, speed) {
            const container = document.getElementById('canvas-container');
            container.innerHTML = "";
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            const geometry = new THREE.IcosahedronGeometry(2, 20);
            const material = new THREE.MeshStandardMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.5 });
            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);
            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(10, 10, 10);
            scene.add(light);
            camera.position.z = 5;
            function animate() {
                requestAnimationFrame(animate);
                sphere.rotation.y += 0.002;
                let scale = 1 + Math.sin(Date.now() * speed) * 0.1;
                sphere.scale.set(scale, scale, scale);
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
