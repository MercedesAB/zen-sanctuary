<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #020410; color: white; overflow: hidden; font-family: sans-serif; }
        
        .interactive {
            cursor: pointer !important;
            pointer-events: auto !important;
            transition: all 0.3s ease;
        }

        .mode-btn {
            opacity: 0.5;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.02);
        }

        .mode-btn:hover { opacity: 1; background: rgba(255, 255, 255, 0.1); }
        
        /* Estados activos claros */
        .active-focus { opacity: 1; border-color: #3b82f6; color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .active-calm { opacity: 1; border-color: #a855f7; color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
        .active-creative { opacity: 1; border-color: #facc15; color: #facc15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.3); }

        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Título refinado, no gigante */
        .main-title { font-weight: 100; letter-spacing: -0.02em; line-height: 1.1; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-[100] p-6 flex justify-between items-center pointer-events-none">
        <div class="text-[10px] tracking-[0.5em] opacity-40">ZEN_SANCTUARY</div>
        <button onclick="toggleLang()" id="lang-btn" class="interactive glass px-5 py-2 rounded-full text-[10px] uppercase tracking-widest">ENGLISH 🌐</button>
    </nav>

    <section id="hero" class="min-h-screen flex flex-col justify-center items-center px-4 text-center relative z-50">
        <h1 id="main-title" class="main-title text-5xl md:text-7xl mb-12">
            Tu mente, <span class="block opacity-30 italic">en orden.</span>
        </h1>
        
        <div class="w-full max-w-lg space-y-10">
            <input type="text" id="mainTask" placeholder="¿En qué vas a trabajar?" 
                   class="w-full bg-transparent border-b border-white/10 p-4 outline-none text-center text-xl md:text-2xl font-light focus:border-white/40 transition-all">
            
            <div class="flex flex-wrap justify-center gap-3">
                <button id="mode-focus" onclick="setMode('focus')" class="interactive mode-btn px-6 py-2 rounded-full text-[10px] uppercase tracking-widest">Enfoque</button>
                <button id="mode-calm" onclick="setMode('calm')" class="interactive mode-btn px-6 py-2 rounded-full text-[10px] uppercase tracking-widest">Calma</button>
                <button id="mode-creative" onclick="setMode('creative')" class="interactive mode-btn px-6 py-2 rounded-full text-[10px] uppercase tracking-widest">Crear</button>
            </div>

            <button onclick="startApp()" id="start-btn" class="interactive px-12 py-4 rounded-full bg-white text-black text-[10px] font-bold uppercase tracking-[0.3em] hover:scale-105 active:scale-95">
                Entrar
            </button>
        </div>
    </section>

    <main id="app-container" class="hidden fixed inset-0 z-[200] bg-[#000208] flex flex-col md:flex-row">
        <aside class="w-full md:w-80 glass p-10 flex flex-col justify-between z-20">
            <div class="space-y-10">
                <button onclick="location.reload()" id="back-btn" class="interactive opacity-40 text-[10px] uppercase tracking-[0.3em] hover:opacity-100">← Volver</button>
                <div>
                    <h2 id="app-label" class="text-[10px] uppercase tracking-[0.4em] font-bold mb-4 opacity-60"></h2>
                    <div id="displayTask" class="text-3xl font-extralight italic text-slate-100 leading-snug"></div>
                </div>
                <div class="space-y-6">
                    <p id="hint-text" class="text-[9px] uppercase tracking-widest text-white/20 leading-relaxed">Mueve el cursor para equilibrar la esfera</p>
                    <button onclick="toggleNoise()" class="interactive w-full glass p-5 rounded-2xl text-left flex justify-between items-center group">
                        <span id="noise-label" class="text-[10px] uppercase tracking-[0.2em] opacity-50">Sonido Brown</span>
                        <div id="noise-dot" class="w-1.5 h-1.5 rounded-full bg-blue-500 opacity-0 shadow-[0_0_8px_#3b82f6]"></div>
                    </button>
                </div>
            </div>
            <div class="text-[9px] opacity-10 uppercase tracking-[0.3em]">NEURAL_CORE // 2026</div>
        </aside>
        <div id="canvas-container" class="flex-1 bg-black"></div>
    </main>

    <script>
        let currentMode = 'focus';
        let isEnglish = false;
        let audioCtx, noiseNode, isPlaying = false;
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

        const ui = {
            es: { title: 'Tu mente, <span class="block opacity-30 italic">en orden.</span>', placeholder: '¿En qué vas a trabajar?', focus: 'Enfoque', calm: 'Calma', creative: 'Crear', enter: 'Entrar', back: '← Volver', hint: 'Mueve el cursor para equilibrar la esfera', noise: 'Sonido Brown', modes: { focus: 'MODO ENFOQUE', calm: 'MODO CALMA', creative: 'MODO CREATIVO' } },
            en: { title: 'Your mind, <span class="block opacity-30 italic">uncluttered.</span>', placeholder: 'What is your focus?', focus: 'Focus', calm: 'Calm', creative: 'Create', enter: 'Enter', back: '← Back', hint: 'Move cursor to balance the sphere', noise: 'Brown Noise', modes: { focus: 'FOCUS MODE', calm: 'CALM MODE', creative: 'CREATIVE MODE' } }
        };

        const config = { focus: { col: 0x3b82f6, spd: 0.001 }, calm: { col: 0xa855f7, spd: 0.0004 }, creative: { col: 0xfacc15, spd: 0.0025 } };

        function toggleLang() {
            isEnglish = !isEnglish;
            const l = isEnglish ? ui.en : ui.es;
            document.getElementById('lang-btn').innerText = isEnglish ? "ESPAÑOL 🌐" : "ENGLISH 🌐";
            document.getElementById('main-title').innerHTML = l.title;
            document.getElementById('mainTask').placeholder = l.placeholder;
            document.getElementById('mode-focus').innerText = l.focus;
            document.getElementById('mode-calm').innerText = l.calm;
            document.getElementById('mode-creative').innerText = l.creative;
            document.getElementById('start-btn').innerText = l.enter;
            document.getElementById('back-btn').innerText = l.back;
            document.getElementById('hint-text').innerText = l.hint;
            document.getElementById('noise-label').innerText = l.noise;
            setMode(currentMode);
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active-focus', 'active-calm', 'active-creative'));
            document.getElementById(`mode-${mode}`).classList.add(`active-${mode}`);
        }

        function startApp() {
            const task = document.getElementById('mainTask').value;
            if(!task) return;
            document.getElementById('displayTask').innerText = `"${task}"`;
            document.getElementById('app-label').innerText = isEnglish ? ui.en.modes[currentMode] : ui.es.modes[currentMode];
            document.getElementById('app-label').style.color = `#${config[currentMode].col.toString(16)}`;
            document.getElementById('app-container').classList.remove('hidden');
            initThree(config[currentMode].col, config[currentMode].spd);
        }

        function initThree(col, spd) {
            const container = document.getElementById('canvas-container');
            container.innerHTML = "";
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth/container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            
            const sphere = new THREE.Mesh(
                new THREE.IcosahedronGeometry(2, 20),
                new THREE.MeshStandardMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.3 })
            );
            scene.add(sphere);
            const light = new THREE.PointLight(0xffffff, 1.5);
            light.position.set(5, 5, 5);
            scene.add(light, new THREE.AmbientLight(0xffffff, 0.2));
            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                mouseX += (targetX - mouseX) * 0.05;
                mouseY += (targetY - mouseY) * 0.05;
                sphere.rotation.y += 0.002 + (mouseX * 0.1);
                sphere.rotation.x += (mouseY * 0.1);
                let p = 1 + Math.sin(Date.now() * spd) * 0.1;
                sphere.scale.set(p, p, p);
                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth) - 0.5;
            targetY = (e.clientY / window.innerHeight) - 0.5;
        });

        function toggleNoise() {
            if(!isPlaying) {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                noiseNode = audioCtx.createScriptProcessor(4096, 1, 1);
                let lastOut = 0;
                noiseNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < 4096; i++) {
                        let white = Math.random() * 2 - 1;
                        out[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = out[i];
                        out[i] *= 2;
                    }
                };
                noiseNode.connect(audioCtx.destination);
                document.getElementById('noise-dot').style.opacity = "1";
            } else {
                noiseNode.disconnect();
                document.getElementById('noise-dot').style.opacity = "0";
            }
            isPlaying = !isPlaying;
        }

        setMode('focus');
    </script>
</body>
</html>
