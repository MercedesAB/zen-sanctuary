<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sanctuary | Intelligent Focus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #020617; color: white; overflow-x: hidden; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .active-mode { border-color: currentColor !important; background: rgba(255, 255, 255, 0.1); opacity: 1 !important; }
        .transition-all { transition: all 0.4s ease; }
        @keyframes pulse-soft { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
        .animate-pulse-soft { animation: pulse-soft 3s infinite; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-50 p-6 flex justify-between items-center">
        <div class="text-xl font-light tracking-widest">ZEN_SANCTUARY</div>
        <button onclick="toggleLang()" id="lang-btn" class="glass px-4 py-2 rounded-full text-[10px] uppercase tracking-widest border border-white/20">English 🌐</button>
    </nav>

    <section id="hero" class="min-h-screen flex flex-col justify-center items-center px-4 text-center">
        <h1 class="text-6xl md:text-8xl font-thin mb-6 tracking-tighter">
            <span id="h-1">Tu mente,</span> <span class="gradient-text" id="h-2">en orden.</span>
        </h1>
        
        <div class="w-full max-w-md space-y-6">
            <input type="text" id="mainTask" placeholder="¿En qué vas a trabajar?" 
                   class="w-full bg-slate-800/30 border-2 border-slate-700 p-6 rounded-3xl outline-none transition-all text-center text-xl focus:shadow-[0_0_20px_rgba(96,165,250,0.2)]">
            
            <div class="flex gap-2">
                <button id="mode-focus" class="flex-1 p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-40 border border-blue-500 text-blue-400">Enfoque</button>
                <button id="mode-calm" class="flex-1 p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-40 border border-purple-500 text-purple-400">Calma</button>
                <button id="mode-creative" class="flex-1 p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-40 border border-yellow-500 text-yellow-400">Crear</button>
            </div>

            <button onclick="startApp()" id="start-btn" class="w-full bg-white text-black font-bold p-5 rounded-2xl hover:scale-105 transition-all uppercase tracking-widest shadow-lg">
                Entrar al Santuario
            </button>
        </div>
    </section>

    <main id="app-container" class="hidden fixed inset-0 z-[100] bg-black flex flex-col md:flex-row">
        <aside class="w-full md:w-80 glass p-8 flex flex-col justify-between z-10">
            <div>
                <button onclick="location.reload()" class="mb-10 opacity-50 text-[10px] uppercase hover:opacity-100 transition-all">← Salir</button>
                <h2 id="app-label" class="text-[10px] uppercase tracking-widest mb-2 font-bold"></h2>
                <div id="displayTask" class="text-2xl font-light italic text-slate-200 mb-6"></div>
                
                <p id="interaction-hint" class="text-[9px] uppercase tracking-widest text-white/40 animate-pulse-soft mb-10">
                    ✨ Mueve el ratón para influir en la energía
                </p>

                <div class="space-y-4">
                    <button onclick="toggleNoise()" id="noise-btn" class="w-full glass p-4 rounded-xl border border-white/10 hover:bg-white/5 transition-all text-left flex justify-between items-center">
                        <span class="text-[10px] uppercase tracking-widest">Sonido Brown</span>
                        <span id="noise-status" class="text-[10px] opacity-50">OFF</span>
                    </button>
                </div>
            </div>
            <div class="text-[9px] opacity-20 uppercase tracking-widest leading-relaxed">
                Frecuencias de resonancia adaptativas.<br>ADHD Digital Regulation.
            </div>
        </aside>
        <div id="canvas-container" class="flex-1 bg-slate-950 cursor-move"></div>
    </main>

    <script>
        let currentMode = 'focus';
        let audioCtx, noiseNode, isPlaying = false;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0; // Para suavizado del mouse

        const moods = {
            focus: { color: 0x60a5fa, speed: 0.001, label: "MODO ENFOQUE", words: ['leer','estudiar','trabajo','reporte','escribir','mail','ordenar','programar'] },
            calm: { color: 0xa855f7, speed: 0.0005, label: "MODO CALMA", words: ['laboratorio','examen','final','estrés','ansiedad','nervios','miedo','paz','urgente'] },
            creative: { color: 0xfacc15, speed: 0.002, label: "MODO CREATIVO", words: ['crear','dibujar','diseñar','idea','música','pintar','inventar','colores'] }
        };

        // Capturar movimiento del mouse
        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth) - 0.5;
            targetY = (e.clientY / window.innerHeight) - 0.5;
        });

        // Detección semántica en tiempo real
        document.getElementById('mainTask').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            let detected = 'focus';
            if (moods.calm.words.some(w => val.includes(w))) detected = 'calm';
            else if (moods.creative.words.some(w => val.includes(w))) detected = 'creative';
            updateInterface(detected);
        });

        function updateInterface(mode) {
            currentMode = mode;
            document.querySelectorAll('[id^="mode-"]').forEach(b => b.classList.remove('active-mode'));
            document.getElementById(`mode-${mode}`).classList.add('active-mode');
            const colors = { focus: '#60a5fa', calm: '#a855f7', creative: '#facc15' };
            document.getElementById('mainTask').style.borderColor = colors[mode];
        }

        updateInterface('focus');

        function startApp() {
            const task = document.getElementById('mainTask').value;
            if(!task) return alert("Por favor, define tu enfoque primero.");
            
            document.getElementById('displayTask').innerText = `"${task}"`;
            document.getElementById('app-label').innerText = moods[currentMode].label;
            document.getElementById('app-label').style.color = `#${moods[currentMode].color.toString(16)}`;
            document.getElementById('app-container').classList.remove('hidden');
            
            initThree(moods[currentMode].color, moods[currentMode].speed);
        }

        function toggleNoise() {
            if(!isPlaying) {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                noiseNode = audioCtx.createScriptProcessor(4096, 1, 1);
                noiseNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    let lastOut = 0;
                    for (let i = 0; i < 4096; i++) {
                        let white = Math.random() * 2 - 1;
                        out[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = out[i];
                        out[i] *= 3.5;
                    }
                };
                noiseNode.connect(audioCtx.destination);
                document.getElementById('noise-status').innerText = "ON";
                document.getElementById('noise-status').style.opacity = "1";
            } else {
                noiseNode.disconnect();
                document.getElementById('noise-status').innerText = "OFF";
                document.getElementById('noise-status').style.opacity = "0.5";
            }
            isPlaying = !isPlaying;
        }

        function initThree(col, spd) {
            const container = document.getElementById('canvas-container');
            container.innerHTML = "";
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth/container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            
            const sphere = new THREE.Mesh(
                new THREE.IcosahedronGeometry(2, 20),
                new THREE.MeshStandardMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.4 })
            );
            scene.add(sphere);
            
            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(10, 10, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.2));
            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                
                // Suavizado del mouse (lerp)
                mouseX += (targetX - mouseX) * 0.05;
                mouseY += (targetY - mouseY) * 0.05;

                // Rotación combinada
                sphere.rotation.y += 0.003 + (mouseX * 0.05);
                sphere.rotation.x += (mouseY * 0.05);
                
                // Pulso rítmico
                let s = 1 + Math.sin(Date.now() * spd) * 0.15;
                sphere.scale.set(s,s,s);
                
                renderer.render(scene, camera);
            }
            animate();

            // Desvanecer el aviso de interacción después de un tiempo
            setTimeout(() => {
                const hint = document.getElementById('interaction-hint');
                if(hint) hint.style.opacity = "0";
            }, 6000);
        }

        function toggleLang() {
            const btn = document.getElementById('lang-btn');
            const isEs = btn.innerText.includes('English');
            btn.innerText = isEs ? "Español 🌐" : "English 🌐";
            document.getElementById('h-1').innerText = isEs ? "Your mind," : "Tu mente,";
            document.getElementById('h-2').innerText = isEs ? "uncluttered." : "en orden.";
            document.getElementById('mainTask').placeholder = isEs ? "What is your focus?" : "¿En qué vas a trabajar?";
            document.getElementById('start-btn').innerText = isEs ? "Enter Sanctuary" : "Entrar al Santuario";
            document.getElementById('interaction-hint').innerText = isEs ? "✨ Move mouse to influence energy" : "✨ Mueve el ratón para influir en la energía";
        }
    </script>
</body>
</html>
