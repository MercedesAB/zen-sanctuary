<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sanctuary | Intelligent Focus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #020617; color: white; overflow-x: hidden; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .active-mode { border-color: currentColor !important; background: rgba(255, 255, 255, 0.1); opacity: 1 !important; }
        .transition-all { transition: all 0.4s ease; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-50 p-6 flex justify-between items-center">
        <div class="text-xl font-light tracking-widest">ZEN_SANCTUARY</div>
        <button onclick="toggleLang()" id="lang-btn" class="glass px-4 py-2 rounded-full text-[10px] uppercase tracking-widest border border-white/20">English 🌐</button>
    </nav>

    <section id="hero" class="min-h-screen flex flex-col justify-center items-center px-4 text-center">
        <h1 class="text-6xl md:text-8xl font-thin mb-6 tracking-tighter">
            <span id="h-1">Tu mente,</span> <span class="gradient-text" id="h-2">en orden.</span>
        </h1>
        
        <div class="w-full max-w-md space-y-6">
            <input type="text" id="mainTask" placeholder="¿En qué vas a trabajar?" 
                   class="w-full bg-slate-800/30 border-2 border-slate-700 p-6 rounded-3xl outline-none transition-all text-center text-xl">
            
            <div class="flex gap-2">
                <button id="mode-focus" class="flex-1 p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-40 border border-blue-500 text-blue-400">Enfoque</button>
                <button id="mode-calm" class="flex-1 p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-40 border border-purple-500 text-purple-400">Calma</button>
                <button id="mode-creative" class="flex-1 p-3 rounded-xl text-[10px] uppercase tracking-widest opacity-40 border border-yellow-500 text-yellow-400">Crear</button>
            </div>

            <button onclick="startApp()" id="start-btn" class="w-full bg-white text-black font-bold p-5 rounded-2xl hover:scale-105 transition-all uppercase tracking-widest">
                Entrar al Santuario
            </button>
        </div>
    </section>

    <main id="app-container" class="hidden fixed inset-0 z-[100] bg-black flex flex-col md:flex-row">
        <aside class="w-full md:w-80 glass p-8 flex flex-col justify-between z-10">
            <div>
                <button onclick="location.reload()" class="mb-10 opacity-50 text-[10px] uppercase">← Salir</button>
                <h2 id="app-label" class="text-[10px] uppercase tracking-widest mb-4 font-bold"></h2>
                <div id="displayTask" class="text-2xl font-light italic text-slate-200"></div>
            </div>
            <button onclick="toggleNoise()" id="noise-btn" class="glass p-6 rounded-2xl border border-white/10 hover:bg-white/5 transition-all">
                SOUND: OFF
            </button>
        </aside>
        <div id="canvas-container" class="flex-1 bg-slate-950"></div>
    </main>

    <script>
        let currentMode = 'focus';
        let audioCtx, noiseNode, isPlaying = false;
        let mouseX = 0, mouseY = 0;

        const moods = {
            focus: { color: 0x60a5fa, speed: 0.001, label: "ENFOQUE", words: ['leer','estudiar','trabajo','reporte','escribir','mail','ordenar'] },
            calm: { color: 0xa855f7, speed: 0.0005, label: "CALMA", words: ['laboratorio','examen','final','estrés','ansiedad','nervios','miedo','paz'] },
            creative: { color: 0xfacc15, speed: 0.002, label: "CREATIVIDAD", words: ['crear','dibujar','diseñar','idea','música','pintar','inventar'] }
        };

        // Escuchar el mouse para la animación 3D
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        document.getElementById('mainTask').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            let detected = 'focus';
            if (moods.calm.words.some(w => val.includes(w))) detected = 'calm';
            else if (moods.creative.words.some(w => val.includes(w))) detected = 'creative';
            updateInterface(detected);
        });

        function updateInterface(mode) {
            currentMode = mode;
            document.querySelectorAll('[id^="mode-"]').forEach(b => b.classList.remove('active-mode'));
            document.getElementById(`mode-${mode}`).classList.add('active-mode');
            const colors = { focus: '#60a5fa', calm: '#a855f7', creative: '#facc15' };
            document.getElementById('mainTask').style.borderColor = colors[mode];
        }

        updateInterface('focus');

        function startApp() {
            const task = document.getElementById('mainTask').value;
            if(!task) return alert("Escribí tu objetivo.");
            document.getElementById('displayTask').innerText = `"${task}"`;
            document.getElementById('app-label').innerText = moods[currentMode].label;
            document.getElementById('app-label').style.color = `#${moods[currentMode].color.toString(16)}`;
            document.getElementById('app-container').classList.remove('hidden');
            initThree(moods[currentMode].color, moods[currentMode].speed);
        }

        function toggleNoise() {
            if(!isPlaying) {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                noiseNode = audioCtx.createScriptProcessor(4096, 1, 1);
                noiseNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < 4096; i++) out[i] = (Math.random() * 2 - 1) * 0.05;
                };
                noiseNode.connect(audioCtx.destination);
                document.getElementById('noise-btn').innerText = "SOUND: ON";
            } else {
                noiseNode.disconnect();
                document.getElementById('noise-btn').innerText = "SOUND: OFF";
            }
            isPlaying = !isPlaying;
        }

        function initThree(col, spd) {
            const container = document.getElementById('canvas-container');
            container.innerHTML = "";
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth/container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            
            const sphere = new THREE.Mesh(
                new THREE.IcosahedronGeometry(2, 15),
                new THREE.MeshStandardMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.5 })
            );
            scene.add(sphere);
            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(10, 10, 10);
            scene.add(light);
            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                
                // Rotación base + Interacción con Mouse
                sphere.rotation.y += 0.002 + (mouseX * 0.05);
                sphere.rotation.x += (mouseY * 0.05);
                
                // Efecto de pulso (respiración)
                let s = 1 + Math.sin(Date.now() * spd) * 0.1;
                sphere.scale.set(s,s,s);
                
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function toggleLang() {
            // Lógica de idioma simplificada para este bloque
            const btn = document.getElementById('lang-btn');
            const isEs = btn.innerText.includes('English');
            btn.innerText = isEs ? "Español 🌐" : "English 🌐";
            document.getElementById('h-1').innerText = isEs ? "Your mind," : "Tu mente,";
            document.getElementById('h-2').innerText = isEs ? "uncluttered." : "en orden.";
            document.getElementById('mainTask').placeholder = isEs ? "What's your focus?" : "¿En qué vas a trabajar?";
            document.getElementById('start-btn').innerText = isEs ? "Enter Sanctuary" : "Entrar al Santuario";
        }
    </script>
</body>
</html>
